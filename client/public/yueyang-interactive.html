const passages=document.getElementById('passages');passages.innerHTML=raw.map((s,i)=>`<section class="passage"><span class="num">${i+1}</span><p>${s.replace(/\{\{([^|]+)\|([^}]+)\}\}/g,(_,id,w)=>`<button class="term" data-id="${id}">${w}</button>`)}</p></section>`).join('');
const bg=document.getElementById('bg'),mt=document.getElementById('mt'),sentence=document.getElementById('sentence'),content=document.getElementById('content');function update(){const n=done.size,s=first.size;document.getElementById('score').textContent=`首次答對 ${s} / ${terms.length}　｜　已完成 ${n} / ${terms.length}`;document.querySelectorAll('.term').forEach(b=>b.classList.toggle('done',done.has(b.dataset.id)));if(n===terms.length){document.getElementById('summary').hidden=false;const total=[...tries.values()].reduce((a,b)=>a+b,0);document.getElementById('final').textContent=`首次答對總分：${s} / ${terms.length}`;document.getElementById('sumtext').textContent=`共作答 ${total} 次；首次答對 ${s} 題，補答完成 ${n-s} 題。`}}
function options(t,error=false){const n=tries.get(t.id)||0;content.innerHTML=`${error?'<p class="error" role="status">錯誤</p>':''}<p class="attempt">本題嘗試：${n} 次</p><div class="options">${t.options.map((x,i)=>`<button class="option" data-i="${i}"><span class="key">${letters[i]}</span><span>${x}</span></button>`).join('')}</div>`;content.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const n=(tries.get(t.id)||0)+1;tries.set(t.id,n);if(i===t.answer){done.add(t.id);if(n===1)first.add(t.id);update();content.innerHTML=`<p class="answer">正確答案：${t.meaning}</p>`}else options(t,true)})}function open(id,trigger){const t=map[id];active=id;previous=trigger;mt.textContent=t.word;sentence.textContent=`原句：${t.excerpt}`;done.has(id)?content.innerHTML=`<p class="answer">正確答案：${t.meaning}</p>`:options(t);bg.classList.add('open');bg.setAttribute('aria-hidden','false');document.getElementById('close').focus()}function close(){bg.classList.remove('open');bg.setAttribute('aria-hidden','true');if(previous)previous.focus();active=null}document.querySelectorAll('.term').forEach(b=>b.onclick=()=>open(b.dataset.id,b));document.getElementById('close').onclick=close;bg.onclick=e=>{if(e.target===bg)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active)close()});document.getElementById('reset').onclick=()=>{if(!done.size||confirm('確定要重設本課的完成進度嗎？')){done.clear();first.clear();tries.clear();update();if(active)close()}};update();
</script><script src="practice-records-v3.js" defer></script></body></html>
