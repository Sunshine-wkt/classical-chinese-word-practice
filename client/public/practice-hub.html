<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指定篇章文言字詞互動練習</title>
  <style>
    /* 設計：羅桂祥中學中文科墨卷課堂——校徽墨綠頂欄、暖紙空間、硃砂索引與紙本練習卡。 */
    :root {
      --ink: #123c32;
      --ink-soft: #004936;
      --school-green: #004936;
      --school-green-deep: #00382b;
      --paper: #fffdf7;
      --ground: #ebe3d3;
      --line: #d8cfbe;
      --vermilion: #a94235;
      --yellow: #f5d66a;
      --green: #004936;
      --muted: #6c736f;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 17%, rgba(0,73,54,.08), transparent 22rem),
        radial-gradient(circle at 91% 82%, rgba(0,73,54,.055), transparent 26rem),
        repeating-linear-gradient(0deg, rgba(55,47,38,.018) 0, rgba(55,47,38,.018) 1px, transparent 1px, transparent 5px),
        var(--ground);
      font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(0,73,54,.55); outline-offset: 3px; }
    .topbar {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px clamp(18px, 5vw, 74px);
      color: #fff9ea;
      background: rgba(0,57,43,.98);
      box-shadow: 0 7px 20px rgba(0,42,31,.2);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: #fff9ea;
      font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      letter-spacing: .075em;
    }
    .seal-dot { width: 13px; height: 13px; flex: 0 0 auto; border-radius: 50% 43% 54% 46%; background: var(--vermilion); box-shadow: 0 0 0 4px rgba(169,66,53,.16); }
    .school-logo { width: 44px; height: 44px; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.26); border-radius: 4px; object-fit: cover; background: var(--school-green); }
    .bar-note { margin: 0; color: rgba(255,249,234,.76); font-size: .85rem; letter-spacing: .08em; }

    main { width: min(1080px, calc(100% - 36px)); margin: 0 auto; padding: clamp(34px, 6vw, 62px) 0 76px; }
    .intro { position: relative; padding: 0 0 38px 32px; }
    .intro::before { position: absolute; top: 8px; bottom: 38px; left: 3px; width: 2px; content: ""; background: linear-gradient(var(--vermilion), rgba(169,66,53,.18)); }
    .eyebrow { margin: 0 0 11px; color: var(--vermilion); font-size: .83rem; font-weight: 800; letter-spacing: .18em; }
    h1 { max-width: 780px; margin: 0; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: clamp(2.25rem, 6vw, 4.4rem); font-weight: 500; letter-spacing: .08em; line-height: 1.15; }
    .intro p:last-child { max-width: 630px; margin: 20px 0 0; color: #4f5a55; font-size: clamp(1rem, 2vw, 1.12rem); line-height: 1.9; }

    .panel { position: relative; overflow: hidden; border: 1px solid rgba(143,125,95,.3); background: rgba(255,253,247,.96); box-shadow: 0 22px 55px rgba(31,38,37,.12), 0 2px 0 rgba(255,255,255,.72) inset; }
    .panel::before { position: absolute; top: 0; bottom: 0; left: 0; width: 7px; content: ""; background: var(--ink-soft); opacity: .78; }
    .step { padding: clamp(27px, 5vw, 42px) clamp(28px, 7vw, 72px); border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: 0; }
    .step-heading { display: flex; align-items: center; gap: 12px; margin: 0 0 21px; }
    .step-count { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 50%; color: #fff9ea; background: var(--ink-soft); font-family: Georgia, "PMingLiU", serif; font-size: .9rem; font-weight: 600; }
    .step-heading h2 { margin: 0; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: 1.26rem; font-weight: 600; letter-spacing: .13em; }
    .step-heading::after { height: 1px; flex: 1; content: ""; background: var(--line); }
    .unit-tabs { display: flex; flex-wrap: wrap; gap: 12px; }
    .unit-tab { position: relative; padding: 12px 17px 12px 28px; border: 1px solid #d8cfbe; border-radius: 0; color: #48534e; background: #fffdf7; cursor: pointer; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: 1.06rem; letter-spacing: .05em; transition: transform .16s var(--ease-out), color .16s var(--ease-out), border-color .16s var(--ease-out), background .16s var(--ease-out); }
    .unit-tab::before { position: absolute; top: 9px; bottom: 9px; left: 12px; width: 1px; content: ""; background: rgba(0,73,54,.4); }
    .unit-tab:active, .lesson-card:active, .launch:active { transform: scale(.975); }
    .unit-tab:hover { border-color: #ae9276; }
    .unit-tab.selected { border-color: var(--school-green); color: #fffdf7; background: var(--school-green); }
    .unit-tab.selected::before { background: rgba(245,214,106,.95); }
    .unit-tab[disabled] { cursor: default; opacity: .55; }
    .unit-tab[disabled]:hover { border-color: #cfc4b1; }

    .step-hint { margin: 0 0 18px; padding: 12px 14px; border-left: 3px solid var(--yellow); color: #48534e; background: #f6f1e6; font-size: .95rem; line-height: 1.65; }
    .lesson-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 24px; }
    .lesson-card { position: relative; min-height: 223px; display: flex; flex-direction: column; align-items: flex-start; padding: 24px 28px 24px 47px; overflow: hidden; border: 0; border-top: 1px solid #d8cfbe; border-bottom: 1px solid #d8cfbe; border-radius: 0; color: #202926; background: linear-gradient(90deg, rgba(0,73,54,.04), transparent 8%), repeating-linear-gradient(90deg, #fff 0, #fff 18px, rgba(91,77,48,.018) 19px), #fff; text-align: left; cursor: pointer; transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), border-color .2s var(--ease-out), background .2s var(--ease-out); }
    .lesson-card::before { position: absolute; top: 18px; bottom: 18px; left: 20px; width: 2px; content: ""; background: linear-gradient(transparent, var(--school-green) 15px, var(--school-green) calc(100% - 15px), transparent); }
    .lesson-card:hover { border-color: #b8a36c; box-shadow: 0 13px 28px rgba(51,46,35,.12); transform: translateY(-3px); }
    .lesson-card.selected { border-color: var(--school-green); background: linear-gradient(135deg, rgba(219,235,226,.76), #fff 58%); box-shadow: 0 13px 28px rgba(0,73,54,.14); }
    .lesson-card::after { position: absolute; top: 20px; right: 20px; width: 24px; height: 2px; content: ""; background: var(--vermilion); }
    .lesson-card.selected::after { width: 34px; background: var(--yellow); }
    .card-index { position: relative; margin: 0 0 18px; color: var(--vermilion); font-family: Georgia, serif; font-size: 1rem; letter-spacing: .08em; }
    .card-index::before { display: inline-block; width: 6px; height: 6px; margin: 0 8px 1px 0; content: ""; border-radius: 50%; background: var(--vermilion); vertical-align: middle; }
    .card-author { margin: 0; color: #69716c; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: .92rem; font-weight: 600; letter-spacing: .12em; }
    .lesson-card h3 { margin: 5px 0 7px; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: clamp(1.65rem, 3.2vw, 2.16rem); font-weight: 600; letter-spacing: .06em; line-height: 1.32; }
    .card-type { margin: 0; color: #67706a; font-size: .9rem; }
    .card-meta { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 5px 8px; color: #4a4539; background: linear-gradient(transparent 16%, rgba(245,214,106,.84) 16%, rgba(245,214,106,.84) 88%, transparent 88%); font-size: .86rem; font-weight: 800; }
    .card-meta::before { width: 7px; height: 7px; content: ""; border-radius: 50%; background: var(--vermilion); }
    .future-index { position: relative; display: grid; place-items: center start; min-height: 132px; padding: 22px 28px 22px 47px; border: 0; border-top: 1px solid #e2dacb; border-bottom: 1px solid #e2dacb; color: #8d877d; background: linear-gradient(90deg, rgba(246,241,230,.95), rgba(255,253,247,.45)); text-align:left; }
    .future-index::before { position: absolute; top: 18px; bottom: 18px; left: 20px; width: 2px; content: ""; background: rgba(0,73,54,.24); }
    .future-index strong { display: block; margin-bottom: 6px; color: #69726d; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: 1.27rem; font-weight: 500; }
    .future-index span { display: inline-block; padding: 3px 6px; background: rgba(245,214,106,.36); font-size: .88rem; }
    .launch-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 24px; }
    .selection-note { margin: 0; color: #5e6661; font-size: .95rem; }
    .selection-note strong { color: var(--ink); }
    .launch { position: relative; padding: 11px 3px 8px 19px; border: 0; border-bottom: 2px solid var(--school-green); border-radius: 0; color: var(--school-green); background: transparent; cursor: pointer; font-family: "BiauKai", "DFKai-SB", "PMingLiU", serif; font-size: 1.06rem; font-weight: 600; letter-spacing: .06em; text-decoration: none; transition: transform .16s var(--ease-out), color .16s var(--ease-out), border-color .16s var(--ease-out), opacity .16s var(--ease-out); }
    .launch::before { position: absolute; top: 14px; left: 2px; width: 8px; height: 8px; content: ""; border-radius: 50%; background: var(--vermilion); }
    .launch:hover { border-color: var(--vermilion); color: var(--vermilion); }
    .launch[aria-disabled="true"] { cursor: not-allowed; opacity: .42; pointer-events: none; }
    .footnote { margin: 28px 0 0; color: #6f746f; font-size: .85rem; line-height: 1.7; text-align: center; }
    .footnote::before { display: inline-block; width: 7px; height: 7px; margin-right: 8px; content: ""; border-radius: 50%; background: var(--vermilion); vertical-align: middle; }

    @media (max-width: 700px) {
      .topbar { min-height: 64px; }
      .bar-note { display: none; }
      .school-logo { width: 35px; height: 35px; }
      main { width: min(100% - 28px, 1080px); padding-top: 38px; }
      .intro { padding-left: 23px; }
      .lesson-grid { grid-template-columns: 1fr; }
      .launch-row { align-items: stretch; flex-direction: column; }
      .launch { text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="school-logo" src="/manus-storage/school-logo_6402c49c.jpeg" alt="羅桂祥中學中文科" /><span class="seal-dot" aria-hidden="true"></span><span>指定篇章文言字詞互動練習</span></div>
    <p class="bar-note">篇章索引</p>
  </header>

  <main>
    <section class="panel" aria-label="互動練習選擇器">
      <div class="step">
        <div class="step-heading"><span class="step-count">1</span><h2>指定文言篇章</h2></div>
        <div class="unit-tabs" role="tablist" aria-label="篇章群組">
          <button class="unit-tab selected" type="button" role="tab" aria-selected="true" data-exercise="lunren">《論仁論孝論君子》</button>
          <button class="unit-tab" type="button" role="tab" aria-selected="false" data-exercise="limpo">《廉頗藺相如列傳》</button>
          <button class="unit-tab" type="button" role="tab" aria-selected="false" disabled>更多篇章・日後加入</button>
        </div>
      </div>

      <div class="step">
        <div class="step-heading"><span class="step-count">2</span><h2>選擇練習</h2></div>
        <p class="step-hint">先點選篇章，再開啟練習。詞語題目只依據對應篇章筆記中的重點詞解編製。</p>
        <div class="lesson-grid">
          <button class="lesson-card" type="button" data-exercise="lunren" data-href="lunren-interactive.html" data-title="孔子《論仁、論孝、論君子》" aria-pressed="false">
            <p class="card-index">01</p>
            <p class="card-author">孔子</p>
            <h3>《論仁、論孝、論君子》</h3>
            <p class="card-type">原文詞解・四選一辨義</p>
            <p class="card-meta">可開始・30 個重點詞語</p>
          </button>
          <button class="lesson-card" type="button" data-exercise="limpo" data-href="limpo-interactive.html" data-title="司馬遷《廉頗藺相如列傳》" aria-pressed="false">
            <p class="card-index">02</p>
            <p class="card-author">司馬遷</p>
            <h3>《廉頗藺相如列傳》</h3>
            <p class="card-type">原文詞解・四選一辨義</p>
            <p class="card-meta">可開始・55 個重點詞語</p>
          </button>
          <div class="future-index" aria-label="預留的新增練習位置">
            <div><strong>下一篇章，待加入</strong><span>新增練習後會在此顯示</span></div>
          </div>
        </div>
        <div class="launch-row">
          <p class="selection-note" id="selection-note">尚未選擇篇章</p>
          <a class="launch" id="launch" href="#" aria-disabled="true">開啟已選練習</a>
        </div>
      </div>
    </section>

    <p class="footnote">本入口只作課堂導覽，不記錄、儲存或傳送學生作答資料。</p>
  </main>

  <script>
    const cards = [...document.querySelectorAll('.lesson-card')];
    const unitTabs = [...document.querySelectorAll('.unit-tab[data-exercise]')];
    const launch = document.getElementById('launch');
    const selectionNote = document.getElementById('selection-note');

    function selectCard(card) {
      cards.forEach(item => {
        const selected = item === card;
        item.classList.toggle('selected', selected);
        item.setAttribute('aria-pressed', String(selected));
      });
      unitTabs.forEach(tab => {
        const selected = tab.dataset.exercise === card.dataset.exercise;
        tab.classList.toggle('selected', selected);
        tab.setAttribute('aria-selected', String(selected));
      });
      launch.href = card.dataset.href;
      launch.setAttribute('aria-disabled', 'false');
      selectionNote.innerHTML = `已選：<strong>${card.dataset.title}</strong>`;
    }

    cards.forEach(card => card.addEventListener('click', () => selectCard(card)));
    unitTabs.forEach(tab => tab.addEventListener('click', () => selectCard(cards.find(card => card.dataset.exercise === tab.dataset.exercise))));
  </script>
</body>
</html>
