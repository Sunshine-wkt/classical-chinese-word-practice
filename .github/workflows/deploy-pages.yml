name: 發佈學生版互動練習至 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案原始碼
        uses: actions/checkout@v4

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴項目
        run: pnpm install --frozen-lockfile

      - name: 建置學生版網站
        run: pnpm build

      - name: 將校徽改為 Pages 內置資產
        run: sed -i 's#/manus-storage/school-logo_6402c49c\.jpeg#assets/school-logo.jpeg#g' dist/public/*.html

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上載靜態網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
